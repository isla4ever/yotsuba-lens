name: Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate credentials without uploading or submitting
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  submit:
    name: Validate or stage standard build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME_API_VERSION: v2
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
      CHROME_PUBLISH_TYPE: STAGED_PUBLISH
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies
      - run: npm run check:all
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser
      - id: package
        name: Prepare Chrome Web Store package
        run: |
          npm run package:store
          echo "zip=dist/design-lens-$(node -p \"require('./package.json').version\")-standard-chrome.zip" >> "$GITHUB_OUTPUT"
      - name: Verify Chrome Web Store configuration
        run: |
          test -n "$CHROME_EXTENSION_ID"
          test -n "$CHROME_PUBLISHER_ID"
          test -n "$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL"
          test -n "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY"
      - name: Validate Chrome Web Store access
        if: inputs.dry_run
        run: npx wxt submit --dry-run --chrome-zip "${{ steps.package.outputs.zip }}"
      - name: Upload and submit for staged review
        if: ${{ !inputs.dry_run }}
        run: npx wxt submit --chrome-zip "${{ steps.package.outputs.zip }}"
