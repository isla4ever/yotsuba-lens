<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yotsuba Lens README Assets</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
        background: #050806;
        color: #f4f7ef;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { display: grid; gap: 48px; padding: 48px; }

      .artboard {
        position: relative;
        overflow: hidden;
        flex: none;
        background: #080b09;
        isolation: isolate;
      }

      .hero {
        width: 1600px;
        height: 720px;
        background-image: url("./yotsuba-readme-hero-base.png");
        background-position: center;
        background-size: cover;
      }

      .hero::after {
        position: absolute;
        inset: 0;
        z-index: -1;
        content: "";
        background: linear-gradient(90deg, transparent 42%, rgba(7, 10, 8, 0.58) 58%, rgba(7, 10, 8, 0.95) 100%);
      }

      .hero-copy {
        position: absolute;
        top: 94px;
        right: 86px;
        width: 630px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 52px;
        color: #d4ff61;
        font-size: 29px;
        font-weight: 760;
      }

      .brand img { width: 58px; height: 58px; border-radius: 12px; }
      .eyebrow { color: #d4ff61; font-size: 20px; font-weight: 720; }

      h1, h2, p { margin: 0; }
      h1 { margin-top: 20px; font-size: 64px; line-height: 1.13; letter-spacing: 0; }

      .hero-description {
        width: 560px;
        margin-top: 28px;
        color: #b5bdb6;
        font-size: 24px;
        line-height: 1.55;
      }

      .tags { display: flex; gap: 12px; margin-top: 40px; }
      .tag {
        padding: 10px 16px;
        border: 1px solid rgba(212, 255, 97, 0.34);
        border-radius: 6px;
        background: rgba(12, 18, 13, 0.72);
        color: #e8eee7;
        font-size: 16px;
        font-weight: 650;
      }

      .flow {
        width: 1600px;
        height: 900px;
        background-image: url("./yotsuba-evidence-flow-base.png");
        background-position: center;
        background-size: cover;
      }

      .flow-header {
        position: absolute;
        top: 42px;
        left: 54px;
      }

      .flow-header h2 { margin-top: 10px; font-size: 40px; line-height: 1.18; }
      .flow-header p { margin-top: 10px; color: #aeb7af; font-size: 19px; }

      .flow-label {
        position: absolute;
        bottom: 46px;
        padding: 12px 18px;
        border: 1px solid rgba(235, 241, 232, 0.18);
        border-radius: 6px;
        background: rgba(8, 12, 9, 0.82);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.24);
        font-size: 18px;
        font-weight: 700;
      }

      .flow-label small { display: block; margin-top: 4px; color: #aeb7af; font-size: 13px; font-weight: 520; }
      .flow-label.source { left: 60px; }
      .flow-label.lens { left: 678px; }
      .flow-label.output { right: 58px; }

      .workspace { width: 1600px; height: 900px; background: #080c09; }
      .workspace::before {
        position: absolute;
        inset: 0;
        z-index: -1;
        content: "";
        background-image: radial-gradient(circle at 76% 28%, rgba(190, 255, 70, 0.09), transparent 33%);
      }

      .workspace-header { position: absolute; top: 44px; left: 60px; }
      .workspace-header h2 { margin-top: 10px; font-size: 39px; }
      .workspace-header p { margin-top: 8px; color: #aeb7af; font-size: 18px; }

      .browser-shot {
        position: absolute;
        top: 190px;
        left: 60px;
        width: 1000px;
        height: 625px;
        overflow: hidden;
        border: 1px solid #344036;
        border-radius: 8px;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.46);
      }

      .browser-shot img { display: block; width: 100%; height: 100%; object-fit: cover; }

      .panel-shot {
        position: absolute;
        top: 72px;
        right: 60px;
        width: 430px;
        height: 756px;
        overflow: hidden;
        border: 1px solid #4d624f;
        border-radius: 8px;
        background: #0b100c;
        box-shadow: 0 34px 90px rgba(0, 0, 0, 0.58);
      }

      .panel-shot img {
        display: block;
        width: 430px;
        height: 900px;
        object-fit: cover;
        object-position: top right;
      }

      .live-badge {
        position: absolute;
        top: 34px;
        right: 32px;
        padding: 8px 12px;
        border-radius: 5px;
        background: #d4ff61;
        color: #0a100b;
        font-size: 13px;
        font-weight: 820;
      }
    </style>
  </head>
  <body>
    <section class="artboard hero" data-export="readme-hero">
      <div class="hero-copy">
        <div class="brand">
          <img src="../../store-assets/icon-128.png" alt="" />
          <span>Yotsuba</span>
        </div>
        <div class="eyebrow">网页风格提取器</div>
        <h1>提取网页风格<br />生成可用 Prompt</h1>
        <p class="hero-description">整理配色、布局、组件、交互和动效，帮助你参考或还原页面风格。</p>
        <div class="tags">
          <span class="tag">设计参照</span>
          <span class="tag">经授权重建</span>
          <span class="tag">智能捕获</span>
        </div>
      </div>
    </section>

    <section class="artboard workspace" data-export="workspace-showcase">
      <div class="workspace-header">
        <div class="eyebrow">真实插件界面</div>
        <h2>页面上下文与侧边栏始终同屏</h2>
        <p>覆盖状态、技术线索和捕获配置集中在一个工作区。</p>
      </div>
      <div class="browser-shot">
        <img src="../../store-assets/screenshot-coverage-dark-1280x800.png" alt="" />
      </div>
      <div class="panel-shot">
        <img src="../../store-assets/screenshot-settings-dark-1280x800.png" alt="" />
        <div class="live-badge">真实侧边栏截图</div>
      </div>
    </section>

    <section class="artboard flow" data-export="evidence-flow">
      <div class="flow-header">
        <div class="eyebrow">WEB STYLE TO PROMPT</div>
        <h2>从网页到可直接使用的 Prompt</h2>
        <p>先提取页面风格，再按需要导出参考或还原资料。</p>
      </div>
      <div class="flow-label source">当前网页<small>配色 · 布局 · 组件 · 动效</small></div>
      <div class="flow-label lens">Yotsuba<small>提取 · 整理 · 提示缺口</small></div>
      <div class="flow-label output">可用资料<small>Prompt · Reference · Rebuild</small></div>
    </section>
  </body>
</html>
