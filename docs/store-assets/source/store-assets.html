<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yotsuba Lens Store Assets</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body {
        color: #111812;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }
      .asset { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
      .brand { display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 760; }
      .mark {
        display: grid;
        place-items: center;
        position: relative;
        width: 48px;
        height: 48px;
        border-radius: 11px;
        color: #111812;
        background: #84ad13;
        font-size: 26px;
        font-weight: 850;
      }
      .mark::before {
        position: absolute;
        top: 11px;
        left: 11px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 14px 0 currentColor, 0 14px currentColor, 14px 14px currentColor;
        content: "";
      }
      .mark::after {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #84ad13;
        content: "";
      }
      .eyebrow { margin: 0 0 16px; color: #5f7f08; font-size: 16px; font-weight: 760; text-transform: uppercase; }
      h1 { margin: 0; max-width: 480px; font-size: 56px; line-height: 1.02; font-weight: 780; }
      p { margin: 22px 0 0; max-width: 430px; color: #4f5a51; font-size: 22px; line-height: 1.45; }
      .chips { display: flex; gap: 10px; margin-top: 28px; }
      .chip { border: 1px solid #a7b0a7; border-radius: 999px; padding: 9px 14px; font-size: 15px; font-weight: 650; }
      .coverage { padding: 52px 62px; background: #f5f6f0; }
      .coverage .brand { position: absolute; top: 44px; left: 62px; }
      .coverage .copy { position: absolute; top: 188px; left: 62px; width: 430px; }
      .coverage .product {
        position: absolute;
        right: 54px;
        top: 154px;
        width: 720px;
        border: 1px solid #cdd2c9;
        border-radius: 8px;
        box-shadow: 0 24px 60px rgba(19, 29, 18, 0.16);
      }
      .coverage .rail { position: absolute; inset: 0 auto 0 0; width: 14px; background: #84ad13; }
      .smart { background: #101712; color: #f5f3e9; }
      .smart .brand { position: absolute; top: 48px; left: 58px; }
      .smart .mark { background: #c8ff56; }
      .smart .mark::after { background: #c8ff56; }
      .smart .copy { position: absolute; left: 58px; top: 188px; width: 470px; }
      .smart .eyebrow { color: #c8ff56; }
      .smart p { color: #b8c1b9; }
      .smart .popup,
      .smart .panel { position: absolute; border: 1px solid #5f685f; border-radius: 8px; box-shadow: 0 28px 70px rgba(0, 0, 0, 0.4); }
      .smart .popup { left: 580px; top: 205px; width: 340px; }
      .smart .panel { right: 58px; top: 50px; width: 320px; }
      .smart .caption { position: absolute; color: #aab3ab; font-size: 14px; font-weight: 650; }
      .smart .caption-popup { left: 580px; top: 618px; }
      .smart .caption-panel { right: 58px; bottom: 28px; width: 320px; }
      .promo { padding: 30px; background: #f5f6f0; }
      .promo .mark { width: 58px; height: 58px; border-radius: 13px; font-size: 31px; }
      .promo .brand { font-size: 20px; }
      .promo h1 { margin-top: 42px; max-width: 330px; font-size: 36px; line-height: 1.04; }
      .promo .accent { position: absolute; right: 0; top: 0; width: 20px; height: 100%; background: #84ad13; }
      .promo .lens {
        position: absolute;
        right: 46px;
        bottom: 38px;
        width: 84px;
        height: 84px;
        border: 13px solid #111812;
        border-radius: 50%;
      }
      .promo .lens::after {
        content: "";
        position: absolute;
        right: -32px;
        bottom: -23px;
        width: 46px;
        height: 13px;
        border-radius: 7px;
        background: #111812;
        transform: rotate(45deg);
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script>
      const asset = new URLSearchParams(location.search).get("asset") || "coverage";
      const root = document.querySelector("#root");
      const brand = '<div class="brand"><span class="mark" aria-hidden="true"></span><span>Yotsuba Lens</span></div>';
      if (asset === "coverage") {
        root.innerHTML = `<section class="asset coverage"><div class="rail"></div>${brand}<div class="copy"><div class="eyebrow">Evidence-first capture</div><h1>Capture evidence, not guesswork.</h1><p>Inspect structure, states, screenshots, and gaps before asking an AI agent to build.</p><div class="chips"><span class="chip">Reference</span><span class="chip">Authorized Rebuild</span></div></div><img class="product" src="../../assets/design-lens-sidepanel-coverage.png" alt="Yotsuba Lens coverage workspace" /></section>`;
      } else if (asset === "smart") {
        root.innerHTML = `<section class="asset smart">${brand}<div class="copy"><div class="eyebrow">One clear workflow</div><h1>Smart Capture stays responsive.</h1><p>Large pages degrade safely. The compact popup starts the job; the Side Panel explains the evidence.</p></div><img class="popup" src="../../assets/design-lens-popup-smart-capture.png" alt="Smart Capture popup" /><div class="caption caption-popup">Compact capture controls</div><img class="panel" src="../../assets/design-lens-reference-workspace.png" alt="Reference workspace" /><div class="caption caption-panel">Default Side Panel workspace</div></section>`;
      } else {
        root.innerHTML = `<section class="asset promo">${brand}<h1>Design evidence for AI coding.</h1><div class="lens"></div><div class="accent"></div></section>`;
      }
    </script>
  </body>
</html>
